name: milkekhelo
description: "Mil ke Khelo — a collection of games to play together."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/home/

  # Baloo 2 (SIL Open Font License — see assets/fonts/Baloo2-OFL.txt),
  # bundled so the app works fully offline.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-400.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
