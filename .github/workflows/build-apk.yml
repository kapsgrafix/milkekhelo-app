name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name milkekhelo --org com.kapsgrafix --platforms android
          fi

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Set app name shown under the icon
        run: sed -i 's/android:label="[^"]*"/android:label="MilkeKhelo"/' android/app/src/main/AndroidManifest.xml

      - name: Allow internet access for online multiplayer
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      # Google banner ads (AdMob): the app's AdMob ID goes in the manifest.
      # Google's TEST ID until MilkeKhelo's own is pasted below — the value
      # must always be there, or the app closes on start.
      - name: AdMob app ID
        env:
          ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
        run: |
          python3 - <<'PY'
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          src = open(path).read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in src:
              start = src.index("<application")
              end = src.index(">", start) + 1
              tag = ('\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID"'
                     ' android:value="' + os.environ["ADMOB_APP_ID"] + '"/>')
              src = src[:end] + tag + src[end:]
              open(path, "w").write(src)
          PY
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml

      # Google sign-in needs Android 6.0+, Google ads need Android 7.0
      # (API 24) or newer.
      - name: Minimum Android version
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' "$F"
          grep -n "minSdk" "$F" || true

      # Sign every build with the same permanent key (stored in the GitHub
      # secret ANDROID_KEYSTORE_BASE64), so Google / Facebook sign-in
      # recognise the app and new builds install over the old one.
      - name: Use the permanent app signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing - building with a temporary key (login will not work)"
            exit 0
          fi
          mkdir -p ~/.android
          # Ignore any spaces / line breaks picked up while pasting the secret.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
          echo "Secret length after cleaning: ${#CLEAN} characters (expected 3620)"
          if ! printf '%s' "$CLEAN" | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not valid - paste the whole contents of ANDROID_KEYSTORE_BASE64.txt again"
            exit 1
          fi
          if ! keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /tmp/key.txt 2>&1; then
            echo "::error::The signing key could not be opened - the secret seems incomplete"
            exit 1
          fi
          grep -E "SHA1:|SHA256:" /tmp/key.txt
          # Point the app's build file straight at this key (the default
          # location turned out to be ignored, giving a throwaway key).
          cp ~/.android/debug.keystore android/app/milkekhelo.keystore
          python3 - <<'PY'
          import os, re
          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"
          if os.path.exists(kts):
              path, block = kts, (
                  "    signingConfigs {\n"
                  "        getByName(\"debug\") {\n"
                  "            storeFile = file(\"milkekhelo.keystore\")\n"
                  "            storePassword = \"android\"\n"
                  "            keyAlias = \"androiddebugkey\"\n"
                  "            keyPassword = \"android\"\n"
                  "        }\n"
                  "    }\n")
          else:
              path, block = groovy, (
                  "    signingConfigs {\n"
                  "        debug {\n"
                  "            storeFile file('milkekhelo.keystore')\n"
                  "            storePassword 'android'\n"
                  "            keyAlias 'androiddebugkey'\n"
                  "            keyPassword 'android'\n"
                  "        }\n"
                  "    }\n")
          src = open(path).read()
          if "milkekhelo.keystore" not in src:
              src, n = re.subn(r"^android \{\n", "android {\n" + block, src, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit("Could not find the android { block in " + path)
              open(path, "w").write(src)
          print("Signing set up in", path)
          PY
          grep -n "milkekhelo.keystore\|signingConfig" android/app/build.gradle* || true

      - run: flutter build apk --release

      # Prove which key actually signed the APK. Google sign-in only works
      # when this is the permanent key (SHA-1 64:C1:B2:F8:...:59:9E).
      - name: Check the APK signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee /tmp/apkcert.txt
          if [ -n "$KEYSTORE_B64" ] && ! grep -qi "64c1b2f8746a6bd0ad6e22132d270f741c40599e" /tmp/apkcert.txt; then
            echo "::error::The APK is NOT signed with the permanent key - Google sign-in will fail"
            exit 1
          fi
          echo "APK is signed with the permanent MilkeKhelo key"

      - uses: actions/upload-artifact@v4
        with:
          name: milkekhelo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
