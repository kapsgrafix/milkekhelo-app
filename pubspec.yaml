name: milkekhelo
description: "Mil ke Khelo — a collection of games to play together."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/home/
    - assets/splash/
    - assets/snakes_and_ladders/
    - assets/chess/
    - assets/memory_grid/
    - assets/audio/sfx/
    - assets/audio/music/

  # Baloo 2 (SIL Open Font License — see assets/fonts/Baloo2-OFL.txt),
  # bundled so the app works fully offline.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-400.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800

# App icon — generated into android/ by `dart run flutter_launcher_icons`
# (the Build APK workflow runs this after `flutter create`).
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "assets/app_icon/ic_background.png"
  adaptive_icon_foreground: "assets/app_icon/ic_foreground.png"
  # 0.14 wraps the foreground in a 16% inset by default, which shrank the
  # artwork well inside the launcher mask. The art already has its own
  # safe-zone padding, so no extra inset.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
