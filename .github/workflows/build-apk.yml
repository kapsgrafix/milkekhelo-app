name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name milkekhelo --org com.kapsgrafix --platforms android
          fi

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Set app name shown under the icon
        run: sed -i 's/android:label="[^"]*"/android:label="MilkeKhelo"/' android/app/src/main/AndroidManifest.xml

      - name: Allow internet access for online multiplayer
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      # Google / Facebook sign-in need Android 6.0 (API 23) or newer.
      - name: Minimum Android version for sign-in
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 23/' "$F"
          grep -n "minSdk" "$F" || true

      # Sign every build with the same permanent key (stored in the GitHub
      # secret ANDROID_KEYSTORE_BASE64), so Google / Facebook sign-in
      # recognise the app and new builds install over the old one.
      - name: Use the permanent app signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing - building with a temporary key (login will not work)"
            exit 0
          fi
          mkdir -p ~/.android
          # Ignore any spaces / line breaks picked up while pasting the secret.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
          echo "Secret length after cleaning: ${#CLEAN} characters (expected 3620)"
          if ! printf '%s' "$CLEAN" | base64 -d > ~/.android/debug.keystore 2>/dev/null; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not valid - paste the whole contents of ANDROID_KEYSTORE_BASE64.txt again"
            exit 1
          fi
          if ! keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /tmp/key.txt 2>&1; then
            echo "::error::The signing key could not be opened - the secret seems incomplete"
            exit 1
          fi
          grep -E "SHA1:|SHA256:" /tmp/key.txt

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: milkekhelo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
